name: CI

on:
  push:
    branches:
      - develop

permissions:
  contents: read

env:
  NEO_AIRPLAY_SKIP_SETUP: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: desktop/.node-version
          package-manager-cache: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          profile: minimal
          components: rustfmt, clippy

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev libfuse2t64 \
            dbus-daemon libgtk-3-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev \
            librsvg2-dev rpm xvfb

      - name: Install frontend dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile --silent

      - name: Run unit checks and build checks
        working-directory: desktop
        run: bun run --silent verify

      - name: Run desktop E2E tests
        if: runner.os != 'Linux'
        working-directory: desktop
        run: bun run --silent test:e2e:ci

      - name: Run desktop E2E tests with a virtual display
        if: runner.os == 'Linux'
        working-directory: desktop
        run: dbus-run-session -- xvfb-run --auto-servernum bun run --silent test:e2e:ci

  create-promotion-pr:
    name: Create or reuse develop to main PR
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check whether this is still the latest develop commit
        id: current-head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/develop" --jq '.object.sha')"
          if [[ "$current_sha" == "$GITHUB_SHA" ]]; then
            echo "is_current=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_current=false" >> "$GITHUB_OUTPUT"
            echo "A newer develop commit exists; its CI run will handle the PR."
          fi

      - name: Create a PR if one is not already open
        if: steps.current-head.outputs.is_current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls" \
            --method GET \
            --field state=open \
            --field base=main \
            --field "head=${GITHUB_REPOSITORY_OWNER}:develop" \
            --jq '.[0].number // empty')"

          if [[ -n "$existing_pr" ]]; then
            echo "Reusing open develop to main PR #$existing_pr."
          else
            gh api "repos/${GITHUB_REPOSITORY}/pulls" \
              --method POST \
              --field title="Merge develop into main" \
              --field head=develop \
              --field base=main \
              --field "body=CI passed on commit ${GITHUB_SHA}. This PR tracks the latest develop branch. The CD workflow publishes the installers after merge." \
              --jq '"Created PR #\(.number)."'
          fi
