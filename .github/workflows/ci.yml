name: CI

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

env:
  NEO_AIRPLAY_SKIP_SETUP: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        !contains(github.event.head_commit.message, '/automation/next-version') &&
        !startsWith(github.event.head_commit.message, 'chore(release): bump version to ') &&
        !startsWith(github.event.head_commit.message, 'Bump develop version to ')
      )
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: desktop/.node-version
          package-manager-cache: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev libfuse2t64 \
            dbus-daemon libgtk-3-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev \
            librsvg2-dev rpm xvfb

      - name: Install frontend dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile --silent

      - name: Install desktop test dependencies
        working-directory: desktop-test
        run: bun install --frozen-lockfile --silent

      - name: Run unit and build checks on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./desktop/scripts/verify.ps1

      - name: Run unit and build checks on macOS and Linux
        if: runner.os != 'Windows'
        run: bash desktop/scripts/verify.sh

      - name: Run desktop E2E tests
        if: runner.os != 'Linux'
        working-directory: desktop
        run: bun run --silent test:e2e:ci

      - name: Run desktop E2E tests with a virtual display
        if: runner.os == 'Linux'
        working-directory: desktop
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: dbus-run-session -- xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" bun run --silent test:e2e:ci

  create-promotion-pr:
    name: Create or reuse develop to main PR
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out pushed commit and inspect changed files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: desktop/.node-version
          package-manager-cache: false

      - name: Check latest head and pending promotion changes
        id: current-head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/develop" --jq '.object.sha')"
          if [[ "$current_sha" == "$GITHUB_SHA" ]]; then
            echo "is_current=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_current=false" >> "$GITHUB_OUTPUT"
            echo "A newer develop commit exists; its CI run will handle the PR."
          fi

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          ahead_commits="$(git rev-list --count "origin/main..${GITHUB_SHA}")"
          if [[ "$ahead_commits" == "0" ]]; then
            echo "has_pending_changes=false" >> "$GITHUB_OUTPUT"
            echo "is_version_only=false" >> "$GITHUB_OUTPUT"
            echo "develop has no commits ahead of main; skipping promotion PR."
            exit 0
          fi

          merge_base="$(git merge-base origin/main "$GITHUB_SHA")"
          mapfile -d '' changed_paths < <(git diff --name-only -z "$merge_base" "$GITHUB_SHA")
          if (( ${#changed_paths[@]} == 0 )); then
            echo "has_pending_changes=false" >> "$GITHUB_OUTPUT"
            echo "is_version_only=false" >> "$GITHUB_OUTPUT"
            echo "develop matches main tree content; skipping promotion PR."
            exit 0
          fi

          echo "has_pending_changes=true" >> "$GITHUB_OUTPUT"
          is_version_only="$(node desktop/scripts/project-version.mjs is-version-only "${changed_paths[@]}")"
          echo "is_version_only=$is_version_only" >> "$GITHUB_OUTPUT"
          if [[ "$is_version_only" == "true" ]]; then
            echo "develop differs from main only in project version files; CI verification still ran, and no promotion PR is needed."
          fi

      - name: Create a PR if one is not already open
        if: >-
          steps.current-head.outputs.is_current == 'true' &&
          steps.current-head.outputs.has_pending_changes == 'true' &&
          steps.current-head.outputs.is_version_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls" \
            --method GET \
            --field state=open \
            --field base=main \
            --field "head=${GITHUB_REPOSITORY_OWNER}:develop" \
            --jq '.[0].number // empty')"

          if [[ -n "$existing_pr" ]]; then
            echo "Reusing open develop to main PR #$existing_pr."
          else
            gh api "repos/${GITHUB_REPOSITORY}/pulls" \
              --method POST \
              --field title="Merge develop into main" \
              --field head=develop \
              --field base=main \
              --field "body=CI passed on commit ${GITHUB_SHA}. This PR tracks the latest develop branch. The CD workflow publishes the installers after merge." \
              --jq '"Created PR #\(.number)."'
          fi
