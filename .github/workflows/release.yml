name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - package.json
      - Cargo.toml
      - Cargo.lock
      - src-tauri/engine-package.json

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  resolve-version:
    runs-on:
      - self-hosted
      - windows
      - x64
      - neo-airplay-release
    timeout-minutes: 90
    outputs:
      version: ${{ steps.release.outputs.version }}
      already-published: ${{ steps.release.outputs.already-published }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # pinned master

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run Windows verification
        shell: pwsh
        run: ./.neo_harness/verify.ps1

      - name: Resolve and reserve the release version
        id: release
        shell: pwsh
        env:
          RELEASE_SOURCE_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin main --tags
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch main and release tags.' }

          $sourceSha = $env:RELEASE_SOURCE_SHA
          $releaseCommit = (git log origin/main --format=%H --grep="Release-For: $sourceSha" -1).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not look up existing release metadata.' }

          if ($releaseCommit) {
              $packageJson = git show "${releaseCommit}:package.json" | Out-String
              if ($LASTEXITCODE -ne 0) { throw 'Could not read the reserved release version.' }
              $version = [string]($packageJson | ConvertFrom-Json).version
          }
          else {
              $package = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
              if ($package.version -notmatch '^(?<major>0|[1-9]\d*)\.(?<minor>0|[1-9]\d*)\.(?<patch>0|[1-9]\d*)$') {
                  throw "package.json contains an invalid stable version: $($package.version)"
              }
              $baseVersion = [version]$package.version
              foreach ($releaseTag in @(git tag --list 'v*')) {
                  if ($LASTEXITCODE -ne 0) { throw 'Could not list existing release tags.' }
                  if ($releaseTag -match '^v(?<version>(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*))$') {
                      $tagVersion = [version]$Matches.version
                      if ($tagVersion -gt $baseVersion) { $baseVersion = $tagVersion }
                  }
              }
              if ($baseVersion.Revision -ne -1 -or $baseVersion.Build -eq [int]::MaxValue) {
                  throw "App patch version has reached its limit: $baseVersion"
              }
              $version = '{0}.{1}.{2}' -f $baseVersion.Major, $baseVersion.Minor, ($baseVersion.Build + 1)
          }

          $tag = "v$version"
          $apiUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          $apiResponse = Invoke-WebRequest -Uri $apiUri -Headers @{
              Accept = 'application/vnd.github+json'
              Authorization = "Bearer $env:GITHUB_TOKEN"
              'User-Agent' = 'NeoAirPlay-Release'
          } -SkipHttpErrorCheck
          $alreadyPublished = 'false'
          if ($apiResponse.StatusCode -eq 200) {
              $releaseInfo = $apiResponse.Content | ConvertFrom-Json
              if (-not $releaseInfo.draft) { $alreadyPublished = 'true' }
          }
          elseif ($apiResponse.StatusCode -ne 404) {
              throw "GitHub Release lookup returned HTTP $($apiResponse.StatusCode)."
          }

          if ($releaseCommit -and $alreadyPublished -ne 'true') {
              $mainPackage = git show 'origin/main:package.json' | Out-String
              if ($LASTEXITCODE -ne 0) { throw 'Could not read the current main package version.' }
              $mainVersion = [string]($mainPackage | ConvertFrom-Json).version
              if ([version]$mainVersion -gt [version]$version) {
                  throw "Release $tag is incomplete but main has advanced to $mainVersion."
              }
          }

          if ($alreadyPublished -ne 'true') {
              & .\scripts\Set-AppVersion.ps1 -Version $version | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'Could not prepare versioned Cargo and frontend metadata.' }
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "already-published=$alreadyPublished" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload version metadata
        if: steps.release.outputs.already-published != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-version-metadata
          path: |
            package.json
            Cargo.toml
            Cargo.lock
          if-no-files-found: error
          retention-days: 1

  build-windows:
    if: needs.resolve-version.outputs.already-published != 'true'
    needs: resolve-version
    runs-on:
      - self-hosted
      - windows
      - x64
      - neo-airplay-release
    timeout-minutes: 360
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # pinned master

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Download version metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-version-metadata
          path: ${{ github.workspace }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile --silent

      - name: Set app version and build Windows packages
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          & .\scripts\Set-AppVersion.ps1 -Version $env:RELEASE_VERSION -SkipLockUpdate | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not set the Windows app version.' }
          & .\scripts\Build-ReleasePackage.ps1 -Version $env:RELEASE_VERSION

      - name: Upload Windows packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows
          path: .build/release-assets/${{ needs.resolve-version.outputs.version }}
          if-no-files-found: error
          retention-days: 1

  build-macos:
    if: needs.resolve-version.outputs.already-published != 'true'
    needs: resolve-version
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # pinned master

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Download version metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-version-metadata
          path: ${{ github.workspace }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile --silent

      - name: Build macOS Apple Silicon and Intel packages
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          & .\scripts\Build-UnixReleasePackage.ps1 -Version $env:RELEASE_VERSION -Target macos-aarch64
          & .\scripts\Build-UnixReleasePackage.ps1 -Version $env:RELEASE_VERSION -Target macos-x86_64

      - name: Upload macOS Apple Silicon packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos-aarch64
          path: .build/release-assets/${{ needs.resolve-version.outputs.version }}/macos-aarch64
          if-no-files-found: error
          retention-days: 1

      - name: Upload macOS Intel packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos-x86_64
          path: .build/release-assets/${{ needs.resolve-version.outputs.version }}/macos-x86_64
          if-no-files-found: error
          retention-days: 1

  build-linux:
    if: needs.resolve-version.outputs.already-published != 'true'
    needs: resolve-version
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential curl file libayatana-appindicator3-dev libfuse2 libgtk-3-dev libssl-dev librsvg2-dev libwebkit2gtk-4.1-dev patchelf

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # pinned master

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Download version metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-version-metadata
          path: ${{ github.workspace }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile --silent

      - name: Build Linux packages
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: .\scripts\Build-UnixReleasePackage.ps1 -Version $env:RELEASE_VERSION -Target linux-x86_64

      - name: Upload Linux packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux-x86_64
          path: .build/release-assets/${{ needs.resolve-version.outputs.version }}/linux-x86_64
          if-no-files-found: error
          retention-days: 1

  publish:
    if: needs.resolve-version.outputs.already-published != 'true'
    needs:
      - resolve-version
      - build-windows
      - build-macos
      - build-linux
    runs-on:
      - self-hosted
      - windows
      - x64
      - neo-airplay-release
    timeout-minutes: 60
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: neo-airplay

      - name: Check out main with the release App token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Prepare release asset directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'neo-airplay-release-assets') | Out-Null

      - name: Download version metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-version-metadata
          path: ${{ runner.temp }}/neo-airplay-release-assets/version-metadata

      - name: Download Windows packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-windows
          path: ${{ runner.temp }}/neo-airplay-release-assets/windows

      - name: Download macOS Apple Silicon packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-macos-aarch64
          path: ${{ runner.temp }}/neo-airplay-release-assets/macos-aarch64

      - name: Download macOS Intel packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-macos-x86_64
          path: ${{ runner.temp }}/neo-airplay-release-assets/macos-x86_64

      - name: Download Linux packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-linux-x86_64
          path: ${{ runner.temp }}/neo-airplay-release-assets/linux-x86_64

      - name: Publish packages and version metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
          RELEASE_ASSETS_DIRECTORY: ${{ runner.temp }}\neo-airplay-release-assets
          GH_REPOSITORY: ${{ github.repository }}
        run: .\scripts\Publish-GitHubRelease.ps1 -Version $env:RELEASE_VERSION -SourceSha $env:RELEASE_SOURCE_SHA -AssetsDirectory $env:RELEASE_ASSETS_DIRECTORY -Repository $env:GH_REPOSITORY
