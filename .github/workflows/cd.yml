name: CD

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

env:
  NEO_AIRPLAY_SKIP_SETUP: "1"

jobs:
  prepare-release:
    name: Validate release version
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      release_ready: ${{ steps.version.outputs.release_ready }}
      already_published: ${{ steps.version.outputs.already_published }}
      correction_required: ${{ steps.version.outputs.correction_required }}
      correction_version: ${{ steps.version.outputs.correction_version }}
    steps:
      - name: Check out merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate version and decide release action
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="$(node desktop/scripts/project-version.mjs read)"
          git fetch --tags --force
          tag="v${version}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "correction_required=false" >> "$GITHUB_OUTPUT"
          echo "correction_version=" >> "$GITHUB_OUTPUT"
          echo "already_published=false" >> "$GITHUB_OUTPUT"

          if ! git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "release_ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag_target="$(git rev-parse "refs/tags/${tag}^{commit}")"
          if [[ "$tag_target" != "$GITHUB_SHA" ]]; then
            correction_version="$(node desktop/scripts/project-version.mjs next-patch "$version")"
            echo "correction_required=true" >> "$GITHUB_OUTPUT"
            echo "correction_version=$correction_version" >> "$GITHUB_OUTPUT"
            echo "release_ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release tag $tag already points to $tag_target. A version correction PR for $correction_version will be opened against main."
            exit 0
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "release_ready=false" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists for this commit; skipping duplicate publication."
          else
            # A prior run may have created the tag before it failed to publish the release.
            echo "release_ready=true" >> "$GITHUB_OUTPUT"
          fi

  correct-release-version:
    name: Open release version correction PR
    needs: prepare-release
    if: needs.prepare-release.outputs.correction_required == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Update version and open or refresh PR
        env:
          GH_TOKEN: ${{ github.token }}
          CORRECTION_VERSION: ${{ needs.prepare-release.outputs.correction_version }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail

          branch="automation/release-version-${CORRECTION_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch" "$GITHUB_SHA"
          node desktop/scripts/project-version.mjs set "$CORRECTION_VERSION"
          git add desktop/package.json desktop/src-tauri/tauri.conf.json \
            desktop/src-tauri/Cargo.toml desktop/src-tauri/Cargo.lock
          git commit -m "chore(release): bump version to ${CORRECTION_VERSION}"

          remote_sha="$(git ls-remote --heads origin "refs/heads/$branch" | awk 'NR == 1 {print $1}')"
          if [[ -n "$remote_sha" ]]; then
            git push --force-with-lease="refs/heads/$branch:$remote_sha" origin "HEAD:refs/heads/$branch"
          else
            git push --force-with-lease="refs/heads/$branch:" origin "HEAD:refs/heads/$branch"
          fi

          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REPOSITORY_OWNER:$branch" \
            --base main --state open --json number --jq '.[0].number // empty')"
          title="Bump release version to ${CORRECTION_VERSION}"
          body="Release tag v${RELEASE_VERSION} already points to another commit. This PR advances the four project version sources to ${CORRECTION_VERSION}; CD will publish after this PR is merged."
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
            echo "Updated release version correction PR #$pr_number."
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "$title" --body "$body"
          fi

  build-installers:
    name: Build installers (${{ matrix.os }})
    needs: prepare-release
    if: needs.prepare-release.outputs.release_ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: desktop/.node-version
          package-manager-cache: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          profile: minimal

      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev libfuse2t64 \
            libgtk-3-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev \
            librsvg2-dev rpm

      - name: Install frontend dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile --silent

      - name: Build installers
        working-directory: desktop
        run: bun run --silent bundle

      - name: Upload installer files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: neo-airplay-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*.dmg
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.exe
            desktop/src-tauri/target/release/bundle/**/*.AppImage
            desktop/src-tauri/target/release/bundle/**/*.deb
            desktop/src-tauri/target/release/bundle/**/*.rpm
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs:
      - prepare-release
      - build-installers
    if: needs.prepare-release.outputs.release_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download installers from all platforms
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: neo-airplay-*
          path: release-assets
          merge-multiple: true

      - name: Create versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail

          mapfile -d '' assets < <(find release-assets -type f \
            \( -iname '*.dmg' -o -iname '*.msi' -o -iname '*.exe' \
            -o -iname '*.appimage' -o -iname '*.deb' -o -iname '*.rpm' \) \
            -print0 | sort -z)

          if (( ${#assets[@]} == 0 )); then
            echo "::error::No installer files were downloaded."
            exit 1
          fi

          tag="v${RELEASE_VERSION}"
          gh release create "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_TARGET" \
            --title "Neo AirPlay $tag" \
            --generate-notes

  prepare-next-version:
    name: Open next version PR for develop
    needs:
      - prepare-release
      - publish-release
    if: >-
      always() && needs.prepare-release.result == 'success' &&
      needs.prepare-release.outputs.correction_required != 'true' &&
      (needs.prepare-release.outputs.already_published == 'true' || needs.publish-release.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0

      - name: Open or refresh next patch version PR
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail

          git fetch --tags --force origin
          develop_version="$(node desktop/scripts/project-version.mjs read)"
          comparison="$(node desktop/scripts/project-version.mjs compare "$develop_version" "$RELEASE_VERSION")"
          if [[ "$comparison" == "1" ]]; then
            echo "develop already has version $develop_version, ahead of released version $RELEASE_VERSION; no bump is needed."
            exit 0
          fi

          next_version="$(node desktop/scripts/project-version.mjs next-patch "$RELEASE_VERSION")"
          branch="automation/next-version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch" origin/develop
          node desktop/scripts/project-version.mjs set "$next_version"
          git add desktop/package.json desktop/src-tauri/tauri.conf.json \
            desktop/src-tauri/Cargo.toml desktop/src-tauri/Cargo.lock
          git commit -m "chore(release): bump version to ${next_version}"

          remote_sha="$(git ls-remote --heads origin "refs/heads/$branch" | awk 'NR == 1 {print $1}')"
          if [[ -n "$remote_sha" ]]; then
            git push --force-with-lease="refs/heads/$branch:$remote_sha" origin "HEAD:refs/heads/$branch"
          else
            git push --force-with-lease="refs/heads/$branch:" origin "HEAD:refs/heads/$branch"
          fi

          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REPOSITORY_OWNER:$branch" \
            --base develop --state open --json number --jq '.[0].number // empty')"
          title="Bump develop version to ${next_version}"
          body="Release v${RELEASE_VERSION} succeeded. This PR advances the four project version sources to the next unused patch version, ${next_version}."
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
            echo "Updated next version PR #$pr_number."
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base develop --head "$branch" \
              --title "$title" --body "$body"
          fi
