name: CD

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

env:
  NEO_AIRPLAY_SKIP_SETUP: "1"

jobs:
  prepare-release:
    name: Validate release version
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Validate version and release tag
        id: version
        run: |
          set -euo pipefail

          package_version="$(jq -r '.version' desktop/package.json)"
          tauri_version="$(jq -r '.version' desktop/src-tauri/tauri.conf.json)"
          cargo_version="$(awk '
            /^\[package\]/ { in_package = 1; next }
            /^\[/ { if (in_package) exit }
            in_package && /^version[[:space:]]*=/ {
              gsub(/["[:space:]]/, "", $0)
              sub(/^version=/, "")
              print
              exit
            }
          ' desktop/src-tauri/Cargo.toml)"
          lock_version="$(awk '
            /^\[\[package\]\]$/ { in_package = 1; package_name = ""; next }
            /^\[/ { in_package = 0 }
            in_package && /^name = / {
              package_name = $3
              gsub(/"/, "", package_name)
            }
            in_package && package_name == "neo-airplay" && /^version = / {
              version = $3
              gsub(/"/, "", version)
              print version
              exit
            }
          ' desktop/src-tauri/Cargo.lock)"

          if [[ -z "$package_version" || "$package_version" != "$tauri_version" || \
                "$package_version" != "$cargo_version" || "$package_version" != "$lock_version" ]]; then
            echo "::error::Project versions must match in package.json, tauri.conf.json, Cargo.toml, and Cargo.lock."
            exit 1
          fi

          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a stable X.Y.Z release version, found '$package_version'."
            exit 1
          fi

          tag="v${package_version}"
          git fetch --tags --force
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "::error::Release tag $tag already exists. Bump the project version in this PR."
            exit 1
          fi

          echo "value=$package_version" >> "$GITHUB_OUTPUT"

  build-installers:
    name: Build installers (${{ matrix.os }})
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: desktop/.node-version
          package-manager-cache: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          profile: minimal

      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev libfuse2t64 \
            libgtk-3-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev \
            librsvg2-dev rpm

      - name: Install frontend dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile --silent

      - name: Build installers
        working-directory: desktop
        run: bun run --silent bundle

      - name: Upload installer files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: neo-airplay-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*.dmg
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.exe
            desktop/src-tauri/target/release/bundle/**/*.AppImage
            desktop/src-tauri/target/release/bundle/**/*.deb
            desktop/src-tauri/target/release/bundle/**/*.rpm
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs:
      - prepare-release
      - build-installers
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download installers from all platforms
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: neo-airplay-*
          path: release-assets
          merge-multiple: true

      - name: Create versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail

          mapfile -d '' assets < <(find release-assets -type f \
            \( -iname '*.dmg' -o -iname '*.msi' -o -iname '*.exe' \
            -o -iname '*.appimage' -o -iname '*.deb' -o -iname '*.rpm' \) \
            -print0 | sort -z)

          if (( ${#assets[@]} == 0 )); then
            echo "::error::No installer files were downloaded."
            exit 1
          fi

          tag="v${RELEASE_VERSION}"
          gh release create "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_TARGET" \
            --title "Neo AirPlay $tag" \
            --generate-notes
